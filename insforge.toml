[auth]
allowed_redirect_urls = [
  "https://www.wildgrove.cv/api/auth/callback",
  "https://www.wildgrove.cv/en/portal",
  "https://www.wildgrove.cv/es/portal",
  "https://www.wildgrove.cv/en/account/reset-password",
  "https://www.wildgrove.cv/es/account/reset-password",
  "https://www.wildgrove.cv/account/reset-password",
  "https://wildgrove.cv/api/auth/callback",
  "https://wildgrove.cv/en/portal",
  "https://wildgrove.cv/es/portal",
  "https://cms.wildgrove.cv/login",
  "https://cms.wildgrove.cv/api/auth/callback",
  "https://cms.wildgrove.cv/",
]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = true

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
